name: Render and publish

# Rebuild the book and publish it to the gh-pages branch on every push to main.
# This makes "push to main" the single step: source update -> live site update.
on:
  push:
    branches: [main]
  workflow_dispatch:        # allow manual runs from the Actions tab

permissions:
  contents: write           # needed to push the built site to gh-pages

concurrency:                # never let two publishes race
  group: quarto-publish
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.9.38"     # match the local toolchain

      - name: Set up TinyTeX (for PDF; exposes tlmgr on PATH)
        uses: r-lib/actions/setup-tinytex@v2

      - name: Install and register TeX Gyre fonts (mainfont/sansfont used by the book)
        # tlmgr puts the .otf in the TeX tree, but XeTeX resolves fontspec fonts
        # by name via fontconfig, which does not scan the TinyTeX tree. So copy the
        # fonts into a fontconfig-scanned dir and refresh the cache.
        run: |
          tlmgr install tex-gyre tex-gyre-math
          GYRE_DIR="$(dirname "$(kpsewhich texgyrepagella-regular.otf)")"
          echo "TeX Gyre fonts located in: $GYRE_DIR"
          mkdir -p "$HOME/.local/share/fonts"
          cp "$GYRE_DIR"/texgyre*.otf "$HOME/.local/share/fonts/"
          fc-cache -f
          echo "--- fonts now visible to fontconfig ---"
          fc-list | grep -iE "gyre (pagella|heros)" | sort

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true # install pre-built Linux binaries (fast, no compiling)

      - name: Install R packages for the knitr engine
        run: Rscript -e 'install.packages(c("knitr", "rmarkdown"))'

      - name: Render (HTML + PDF) and publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
