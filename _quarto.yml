project:
  type: book
  output-dir: _book

book:
  title: "The World Economy over the Very Long Run"
  subtitle: "A History in Data and Debates"
  author:
    - name: "Ronan C. Lyons"
      affiliation: "Trinity College Dublin and the Centre for Economics, Policy & History"
  date: last-modified          # auto: date of the most recent source change (no manual edits)
  date-format: "MMMM YYYY"     # e.g. "July 2026"
  cover-image: book/images/cover-dhow.jpg
  search: true
  downloads: [pdf]
  sidebar:
    style: docked
  chapters:
    - index.qmd
    - 00-introduction.qmd
    - part: parts/part-a.qmd
      chapters:
        - 01-deep-structures.qmd
        - 02-first-world-system.qmd
    - part: parts/part-b.qmd
      chapters:
        - 03-maritime-apogee.qmd
        - 04-high-medieval-mongol.qmd
    - part: parts/part-c.qmd
      chapters:
        - 05-world-becomes-one.qmd
        - 06-companies-coercion.qmd
    - part: parts/part-d.qmd
      chapters:
        - 07-great-divergence.qmd
        - 08-first-global-economy.qmd
    - part: parts/part-e.qmd
      chapters:
        - 09-disintegration.qmd
        - 10-asian-rebalancing.qmd
    - 11-conclusion.qmd
  appendices:
    - appendix-a-datasets.qmd
    - appendix-b-sources.qmd
    - appendix-c-ledger.qmd
    - appendix-d-numbers.qmd
    - appendix-e-disputes.qmd
    - references.qmd

bibliography: book/references.bib
# csl: re-enable once references.bib is populated (Phase 3); default style until then.

format:
  html:
    theme:
      - cosmo
      - book/style/world-economy.scss
    toc: true
    toc-title: "On this page"
    number-sections: true
    number-depth: 1            # number chapters only, not the within-chapter sections
    lightbox: auto             # all figures (graphs + photos) enlarge on click
    reference-location: margin   # source endnotes set in the right margin (Tufte-style)
    linestretch: 1.62
    grid:
      sidebar-width: 270px
      body-width: 760px
      margin-width: 340px
      gutter-width: 1.6rem
  pdf:
    documentclass: scrbook
    papersize: a4
    geometry:           # explicit ~symmetric margins -> text block ~80% of page width
      - inner=22mm      # (KOMA's DIV keeps a lopsided 1:2 inner:outer ratio; geometry overrides it)
      - outer=20mm
      - top=24mm
      - bottom=26mm
    number-sections: true   # number the 10 chapters so @sec-chNN cross-refs resolve ("Chapter 2")
    number-depth: 1         # number chapters only, not the within-chapter ## sections
    fig-pos: 'tbp'    # float to top/bottom/float-page only (no inline 'h'): text flows without
                      # whitespace, and figures never sit inline jammed against a following callout
                      # box. All figures live outside callout boxes (no "Not in outer par mode").
    pdf-engine: xelatex
    mainfont: "TeX Gyre Pagella"   # Palatino-like book serif; ships with TinyTeX (reproducible)
    sansfont: "TeX Gyre Heros"
    include-in-header:
      - book/tex/unicode-map.tex
      - book/tex/pdf-layout.tex
      - book/tex/cover-page.tex

